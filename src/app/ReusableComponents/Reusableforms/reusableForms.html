<form [formGroup]="form">
    <div>
        @if(controls?.type == 'text'){
        <div>
            <mat-form-field appearance="outline">
                <mat-label>{{controls?.label}}</mat-label>
                <input matInput type="text" [formControlName]="controls?.name">
            </mat-form-field>
        </div>
        }
    </div>
</form>
