<div class="aline">
    <h1>Dynamic Form For Add FormGroups Dynamically</h1>
</div>

<div>
    <form [formGroup]="dynamicForm">
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput type="text" formControlName="Name">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Sername</mat-label>
            <input matInput type="text" formControlName="Sername">
        </mat-form-field>
        <div formArrayName="Addresses">
            <div *ngFor="let controls of addressarray.controls;let i=index" [formGroupName]="i">
                <mat-form-field>
                    <mat-label>Country</mat-label>
                    <input matInput type="text" formControlName="country">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>State</mat-label>
                    <input matInput type="text" formControlName="state">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Village</mat-label>
                    <input matInput type="text" formControlName="village">
                </mat-form-field>
                    <button mat-raised-button color="primary" (click)="remove(i)">Remove</button>
            </div>
            <div>
                <button mat-raised-button color="primary" (click)="addAddressform()">Add Address Form</button>
            </div>
        </div>
    </form>

    <div style="float: right;">
        <button mat-raised-button color="warn" (click)="back()">Go back</button>
        <button mat-raised-button color="warn" (click)="submit()">Submit</button>
    </div>
</div>
